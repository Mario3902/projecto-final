*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{width:100%;height:100%;overflow:hidden;background:#020010;font-family:system-ui,sans-serif}


@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(60px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes zoomDive {
  from { opacity: 0; transform: scale(0.1); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes rotatePlanet {
  from { background-position: 0% 50%; }
  to { background-position: 200% 50%; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 20px var(--glow-color), 0 0 60px var(--glow-color); }
  50% { box-shadow: 0 0 40px var(--glow-color), 0 0 100px var(--glow-color), 0 0 160px var(--glow-color); }
}
@keyframes shootingStar {
  0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translateX(400px) translateY(400px) rotate(-45deg); opacity: 0; }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}
@keyframes nebulaDrift {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.15; }
  33% { transform: translate(30px, -20px) scale(1.05); opacity: 0.2; }
  66% { transform: translate(-20px, 15px) scale(0.95); opacity: 0.12; }
}
@keyframes orbitalPath {
  from { stroke-dashoffset: 20; }
  to { stroke-dashoffset: 0; }
}
@keyframes ringRotate {
  from { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg); }
  to { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg); }
}
@keyframes atmosphereBreath {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.08); opacity: 0.5; }
}
@keyframes surfaceScan {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 0%; }
}
@keyframes layerPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
@keyframes starFieldMove {
  from { transform: translateY(0); }
  to { transform: translateY(-100vh); }
}
@keyframes countUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-fadeIn { animation: fadeIn 0.4s ease-out; }
.animate-fadeInUp { animation: fadeInUp 0.6s ease-out; }
.animate-slideInRight { animation: slideInRight 0.5s ease-out; }
.animate-zoomDive { animation: zoomDive 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.animate-float { animation: float 4s ease-in-out infinite; }
.animate-twinkle { animation: twinkle 3s ease-in-out infinite; }
.animate-surfaceScan { animation: surfaceScan 20s linear infinite; }

.planet-3d {
  animation: rotatePlanet 20s linear infinite;
  background-size: 200% 100%;
}

.shooting-star {
  position: absolute;
  width: 100px;
  height: 1.5px;
  background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent);
  animation: shootingStar 1.5s ease-out forwards;
}

.nebula {
  animation: nebulaDrift 25s ease-in-out infinite;
  filter: blur(60px);
}

/* Custom scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

html, body, #root {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  background: #020010;
}

.glass {
  background: rgba(10, 10, 40, 0.6);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
}
.glass-strong {
  background: rgba(10, 10, 40, 0.85);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.1);
}

.tab-active {
  background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(168,85,247,0.2));
  border-color: rgba(99,102,241,0.5);
  color: white;
}

.orbit-line {
  animation: orbitalPath 2s linear infinite;
}

.atmosphere-glow {
  animation: atmosphereBreath 4s ease-in-out infinite;
}

.layer-ring {
  animation: layerPulse 3s ease-in-out infinite;
  transition: transform 0.3s, box-shadow 0.3s;
}
.layer-ring:hover {
  transform: scale(1.08) !important;
  z-index: 50;
}

.size-comparison-bar {
  animation: countUp 0.8s ease-out both;
}

.tooltip-planet {
  position: relative;
}
.tooltip-planet::after {
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 12px);
  top: 50%;
  transform: translateY(-50%);
  background: rgba(10,10,40,0.95);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  color: white;
  font-weight: 500;
}
.tooltip-planet:hover::after {
  opacity: 1;
}

function Stars() {
  const [shootingStars, setShootingStars] = useState<ShootingStar[]>([]);
  const [counter, setCounter] = useState(0);

  const stars = useMemo(() => {
    return Array.from({ length: 400 }, (_, i) => ({
      id: i,
      x: Math.random() * 100,
      y: Math.random() * 100,
      size: Math.random() * 2.5 + 0.5,
      opacity: Math.random() * 0.7 + 0.3,
      animDelay: Math.random() * 5,
      animDuration: Math.random() * 3 + 2,
      isBright: Math.random() < 0.08,
      color: Math.random() < 0.1 ? "#aaccff" : Math.random() < 0.05 ? "#ffddaa" : "#ffffff",
    }));
  }, []);

  const nebulas = useMemo(() => [
    { x: 15, y: 20, w: 300, h: 200, color: "rgba(100, 50, 180, 0.12)", delay: 0 },
    { x: 70, y: 60, w: 350, h: 250, color: "rgba(30, 80, 180, 0.1)", delay: 8 },
    { x: 40, y: 75, w: 280, h: 180, color: "rgba(180, 50, 100, 0.08)", delay: 16 },
    { x: 80, y: 15, w: 250, h: 200, color: "rgba(50, 150, 120, 0.07)", delay: 12 },
  ], []);

  useEffect(() => {
    const interval = setInterval(() => {
      if (Math.random() < 0.4) {
        const newStar = {
          id: counter,
          x: Math.random() * 80,
          y: Math.random() * 40,
          delay: 0,
        };
        setShootingStars(prev => [...prev.slice(-3), newStar]);
        setCounter(c => c + 1);
      }
    }, 3000);
    return () => clearInterval(interval);
  }, [counter]);

  return (
    <div className="fixed inset-0 overflow-hidden pointer-events-none">
      {/* Nebulas */}
      {nebulas.map((n, i) => (
        <div
          key={`nebula-${i}`}
          className="nebula absolute rounded-full"
          style={{
            left: `${n.x}%`,
            top: `${n.y}%`,
            width: `${n.w}px`,
            height: `${n.h}px`,
            background: `radial-gradient(ellipse, ${n.color}, transparent 70%)`,
            animationDelay: `${n.delay}s`,
            transform: "translate(-50%, -50%)",
          }}
        />
      ))}

      {/* Stars */}
      {stars.map((star) => (
        <div
          key={star.id}
          className={`absolute rounded-full ${star.isBright ? "animate-twinkle" : "animate-pulse"}`}
          style={{
            left: `${star.x}%`,
            top: `${star.y}%`,
            width: `${star.size}px`,
            height: `${star.size}px`,
            opacity: star.opacity,
            animationDelay: `${star.animDelay}s`,
            animationDuration: `${star.animDuration}s`,
            backgroundColor: star.color,
            boxShadow: star.isBright ? `0 0 ${star.size * 3}px ${star.color}` : "none",
          }}
        />
      ))}

      {/* Shooting stars */}
      {shootingStars.map((s) => (
        <div
          key={s.id}
          className="shooting-star"
          style={{
            left: `${s.x}%`,
            top: `${s.y}%`,
          }}
        />
      ))}
    </div>
  );
}





function SolarSystem({ onPlanetClick, onSunClick, isPaused, zoomedPlanet }) {
  const [time, setTime] = useState(0);
  const [hoveredPlanet, setHoveredPlanet] = useState<string | null>(null);
  const containerRef = useRef(null);
  const [center, setCenter] = useState({ x: 0, y: 0 });
  const [scale, setScale] = useState(1);
  const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
  const animRef = useRef<number | null>(null);
  const lastTimeRef = useRef<number>(0);

  useEffect(() => {
    const updateCenter = () => {
      if (containerRef.current) {
        const rect = containerRef.current.getBoundingClientRect();
        setCenter({ x: rect.width / 2, y: rect.height / 2 });
        const minDim = Math.min(rect.width, rect.height);
        setScale(minDim / 1050);
      }
    };
    updateCenter();
    window.addEventListener("resize", updateCenter);
    return () => window.removeEventListener("resize", updateCenter);
  }, []);

  useEffect(() => {
    if (isPaused) {
      if (animRef.current) cancelAnimationFrame(animRef.current);
      return;
    }
    const animate = (timestamp) => {
      if (lastTimeRef.current) {
        const delta = (timestamp - lastTimeRef.current) / 1000;
        setTime(t => t + delta * 0.3);
      }
      lastTimeRef.current = timestamp;
      animRef.current = requestAnimationFrame(animate);
    };
    animRef.current = requestAnimationFrame(animate);
    return () => {
      if (animRef.current) cancelAnimationFrame(animRef.current);
      lastTimeRef.current = 0;
    };
  }, [isPaused]);

  const handleMouseMove = (e) => {
    if (containerRef.current) {
      const rect = containerRef.current.getBoundingClientRect();
      setMousePos({
        x: (e.clientX - rect.left - rect.width / 2) * 0.005,
        y: (e.clientY - rect.top - rect.height / 2) * 0.005,
      });
    }
  };

  const getPlanetPosition = (planet) => {
    const angle = time * planet.orbitSpeed * 0.06;
    const r = planet.orbitRadius * scale;
    return {
      x: center.x + Math.cos(angle) * r,
      y: center.y + Math.sin(angle) * r * 0.4,
      depth: Math.sin(angle),
    };
  };

  // Sort planets by depth for proper z-ordering
  const sortedPlanets = [...planets]
    .map(p => ({ ...p, pos: getPlanetPosition(p) }))
    .sort((a, b) => a.pos.depth - b.pos.depth);

  const containerStyle = zoomedPlanet
    ? {
        transform: `scale(0.1) rotate(10deg)`,
        opacity: 0,
        transition: "all 0.8s cubic-bezier(0.16, 1, 0.3, 1)",
      }
    : {
        transform: `perspective(1500px) rotateX(${2 + mousePos.y}deg) rotateY(${mousePos.x}deg)`,
        opacity: 1,
        transition: "transform 0.1s ease-out, opacity 0.5s",
      };

  return (
    <div
      ref={containerRef}
      className="relative w-full h-full overflow-hidden"
      onMouseMove={handleMouseMove}
      style={containerStyle}
    >
      {/* Orbit paths */}
      <svg className="absolute inset-0 w-full h-full pointer-events-none">
        <defs>
          {planets.map(planet => (
            <linearGradient key={`grad-${planet.id}`} id={`orbit-grad-${planet.id}`}>
              <stop offset="0%" stopColor={planet.color} stopOpacity="0.15" />
              <stop offset="50%" stopColor={planet.color} stopOpacity="0.05" />
              <stop offset="100%" stopColor={planet.color} stopOpacity="0.15" />
            </linearGradient>
          ))}
        </defs>
        {planets.map((planet) => (
          <ellipse
            key={`orbit-${planet.id}`}
            cx={center.x}
            cy={center.y}
            rx={planet.orbitRadius * scale}
            ry={planet.orbitRadius * scale * 0.4}
            fill="none"
            stroke={hoveredPlanet === planet.id ? `${planet.color}40` : `url(#orbit-grad-${planet.id})`}
            strokeWidth={hoveredPlanet === planet.id ? 2 : 1}
            strokeDasharray={hoveredPlanet === planet.id ? "none" : "6 4"}
            className="orbit-line"
            style={{ transition: "stroke 0.3s, stroke-width 0.3s" }}
          />
        ))}
      </svg>

      {/* Sun glow layers */}
      <div
        className="absolute rounded-full pointer-events-none"
        style={{
          left: center.x - 120 * scale,
          top: center.y - 120 * scale,
          width: 240 * scale,
          height: 240 * scale,
          background: "radial-gradient(circle, rgba(255,170,0,0.15) 0%, rgba(255,100,0,0.05) 40%, transparent 70%)",
          filter: "blur(10px)",
        }}
      />
      <div
        className="absolute rounded-full pointer-events-none atmosphere-glow"
        style={{
          left: center.x - 80 * scale,
          top: center.y - 80 * scale,
          width: 160 * scale,
          height: 160 * scale,
          background: "radial-gradient(circle, rgba(255,200,0,0.12) 0%, rgba(255,140,0,0.04) 50%, transparent 70%)",
        }}
      />

      {/* Sun */}
      <button
        onClick={onSunClick}
        className="absolute cursor-pointer group z-10"
        style={{
          left: center.x - 40 * scale,
          top: center.y - 40 * scale,
          width: 80 * scale,
          height: 80 * scale,
        }}
      >
        <div
          className="w-full h-full rounded-full transition-transform group-hover:scale-110 relative"
          style={{
            background: "radial-gradient(circle at 30% 30%, #ffffff, #fff700 20%, #ffcc00 40%, #ffaa00 60%, #ff7700 80%, #ff4400)",
            boxShadow: `0 0 ${30 * scale}px #ffcc00, 0 0 ${60 * scale}px #ffaa0080, 0 0 ${120 * scale}px #ff660040`,
          }}
        >
          {/* Sun surface texture */}
          <div
            className="absolute inset-1 rounded-full opacity-40 planet-3d"
            style={{
              background: "repeating-radial-gradient(circle at 40% 40%, transparent 0%, rgba(255,150,0,0.3) 3%, transparent 6%)",
              mixBlendMode: "overlay",
            }}
          />
          {/* Corona wisps */}
          <div className="absolute -inset-3 rounded-full opacity-30 animate-pulse"
            style={{
              background: "radial-gradient(circle, transparent 45%, rgba(255,200,0,0.2) 55%, transparent 65%)",
            }}
          />
        </div>
        <div className="absolute -bottom-8 left-1/2 -translate-x-1/2 text-yellow-300 text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap drop-shadow-lg">
          ☀️ Sol
        </div>
      </button>

      {/* Planets */}
      {sortedPlanets.map((planet) => {
        const pos = planet.pos;
        const isHovered = hoveredPlanet === planet.id;
        const depthScale = 0.7 + (pos.depth + 1) * 0.2;
        const planetSize = planet.size * scale * depthScale;
        const depthOpacity = 0.6 + (pos.depth + 1) * 0.25;

        return (
          <button
            key={planet.id}
            className="absolute cursor-pointer group"
            style={{
              left: pos.x - planetSize,
              top: pos.y - planetSize,
              width: planetSize * 2,
              height: planetSize * 2,
              zIndex: Math.round((pos.depth + 1) * 100),
              transition: "filter 0.3s",
              transform: isHovered ? "scale(1.35)" : "scale(1)",
              filter: `brightness(${isHovered ? 1.3 : depthOpacity})`,
            }}
            onClick={() => onPlanetClick(planet)}
            onMouseEnter={() => setHoveredPlanet(planet.id)}
            onMouseLeave={() => setHoveredPlanet(null)}
          >
            {/* Atmosphere glow */}
            {planet.hasAtmosphere && (
              <div
                className="absolute rounded-full atmosphere-glow"
                style={{
                  inset: `-${planetSize * 0.2}px`,
                  background: `radial-gradient(circle, ${planet.atmosphereColor}, transparent 70%)`,
                  opacity: isHovered ? 0.8 : 0.4,
                }}
              />
            )}

            {/* Planet body */}
            <div
              className="w-full h-full rounded-full relative overflow-hidden"
              style={{
                background: planet.texture,
                boxShadow: isHovered
                  ? `0 0 ${25 * scale}px ${planet.color}80, 0 0 ${50 * scale}px ${planet.color}40, inset -${planetSize * 0.15}px -${planetSize * 0.1}px ${planetSize * 0.3}px rgba(0,0,0,0.5)`
                  : `0 0 ${8 * scale}px ${planet.color}30, inset -${planetSize * 0.15}px -${planetSize * 0.1}px ${planetSize * 0.3}px rgba(0,0,0,0.5)`,
                transition: "box-shadow 0.3s",
              }}
            >
              {/* Rotating surface */}
              <div
                className="absolute inset-0 rounded-full planet-3d opacity-30"
                style={{
                  background: `repeating-linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 25%, transparent 50%)`,
                  backgroundSize: "200% 100%",
                  mixBlendMode: "overlay",
                }}
              />
              {/* Specular highlight */}
              <div
                className="absolute rounded-full"
                style={{
                  top: "8%",
                  left: "12%",
                  width: "35%",
                  height: "25%",
                  background: "radial-gradient(ellipse, rgba(255,255,255,0.25), transparent)",
                  filter: "blur(2px)",
                }}
              />
              {/* Terminator shadow */}
              <div
                className="absolute inset-0 rounded-full"
                style={{
                  background: "linear-gradient(100deg, transparent 30%, rgba(0,0,0,0.3) 55%, rgba(0,0,0,0.7) 100%)",
                }}
              />
            </div>

            {/* Ring for Saturn/Uranus */}
            {planet.ringColor && (
              <>
                <div
                  className="absolute top-1/2 left-1/2 rounded-full pointer-events-none"
                  style={{
                    width: planetSize * 3,
                    height: planetSize * 0.8,
                    transform: "translate(-50%, -50%) rotateX(75deg)",
                    background: `linear-gradient(90deg, transparent 5%, ${planet.ringColor}20 15%, ${planet.ringColor}50 30%, ${planet.ringColor}30 50%, ${planet.ringColor}50 70%, ${planet.ringColor}20 85%, transparent 95%)`,
                    border: `1px solid ${planet.ringColor}30`,
                    borderRadius: "50%",
                    boxShadow: `0 0 8px ${planet.ringColor}20`,
                  }}
                />
                <div
                  className="absolute top-1/2 left-1/2 rounded-full pointer-events-none"
                  style={{
                    width: planetSize * 2.4,
                    height: planetSize * 0.6,
                    transform: "translate(-50%, -50%) rotateX(75deg)",
                    border: `1px solid ${planet.ringColor}40`,
                    borderRadius: "50%",
                  }}
                />
              </>
            )}

            {/* Name tooltip */}
            <div
              className="absolute left-1/2 -translate-x-1/2 font-bold whitespace-nowrap pointer-events-none transition-all duration-300"
              style={{
                bottom: -(22 * scale),
                color: planet.color,
                opacity: isHovered ? 1 : 0,
                fontSize: `${Math.max(11, 13 * scale)}px`,
                textShadow: `0 0 10px ${planet.color}80`,
                transform: `translateX(-50%) translateY(${isHovered ? 0 : 5}px)`,
              }}
            >
              {planet.namePt}
              <span className="block text-center text-[9px] opacity-60 font-normal">clique para mergulhar</span>
            </div>
          </button>
        );
      })}
    </div>
  );
}

      {planets.map((planet) => {
        const isActive = activePlanet === planet.id;
        const btnSize = Math.max(28, Math.min(planet.size * 1.4, 46));
        return (
          <button
            key={planet.id}
            onClick={() => onPlanetClick(planet)}
            className="tooltip-planet group relative flex items-center justify-center rounded-full transition-all hover:scale-115 cursor-pointer flex-shrink-0"
            data-tooltip={planet.namePt}
            style={{
              width: `${btnSize}px`,
              height: `${btnSize}px`,
              background: planet.texture,
              boxShadow: isActive
                ? `0 0 15px ${planet.color}80, 0 0 30px ${planet.color}30`
                : `0 0 6px ${planet.color}30`,
              border: isActive ? `2px solid ${planet.color}60` : "1px solid transparent",
              transform: isActive ? "scale(1.15)" : undefined,
            }}
          >
            {/* Specular */}
            <div className="absolute rounded-full" style={{
              top: "10%", left: "15%", width: "30%", height: "20%",
              background: "radial-gradient(ellipse, rgba(255,255,255,0.2), transparent)",
            }} />
            {/* Shadow */}
            <div className="absolute inset-0 rounded-full" style={{
              background: "linear-gradient(120deg, transparent 40%, rgba(0,0,0,0.4) 100%)",
            }} />

            {/* Ring for Saturn/Uranus */}
            {planet.ringColor && (
              <div className="absolute top-1/2 left-1/2 rounded-full pointer-events-none" style={{
                width: `${btnSize * 1.5}px`,
                height: `${btnSize * 0.35}px`,
                transform: "translate(-50%, -50%) rotateX(75deg)",
                border: `1px solid ${planet.ringColor}60`,
                borderRadius: "50%",
              }} />
            )}

            {/* Active indicator */}
            {isActive && (
              <div className="absolute -right-1 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full" style={{
                backgroundColor: planet.color,
                boxShadow: `0 0 6px ${planet.color}`,
              }} />
            )}
          </button>
        );
      })}
    </div>
  );
}

                          width: `${Math.max(10, 100 - (planet.order / 8) * 80)}%`,
                          background: `linear-gradient(90deg, ${planet.gradient[2]}, ${planet.color})`,
                          animationDelay: "0.3s",

                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "compare" && (
              <div className="space-y-5 animate-fadeIn">
                <p className="text-gray-400 text-sm">Comparação de {planet.namePt} com a Terra:</p>

                {/* Size comparison */}
                <div className="glass rounded-xl p-5">
                  <h4 className="text-white text-sm font-bold mb-4">📏 Comparação de Tamanho</h4>
                  <div className="flex items-end justify-center gap-8 py-4">

                      <div className="rounded-full" style={{
                        width: `${Math.min(planet.compareSizeToEarth * 80, 160)}px`,
                        height: `${Math.min(planet.compareSizeToEarth * 80, 160)}px`,

                        boxShadow: `0 0 20px ${planet.color}40, inset -8px -6px 15px rgba(0,0,0,0.5)`,
                        minWidth: "30px",
                        minHeight: "30px",

                      <span className="text-xs font-bold" style={{ color: planet.color }}>{planet.namePt}</span>
                      <span className="text-[10px] text-gray-500">{planet.facts.diameter}</span>

                        <div className="h-3 rounded-full size-comparison-bar" style={{
                          width: `${Math.min((parseFloat(planet.facts.gravity.replace(",", ".")) / 9.8) * 100, 100)}%`,
                          background: `linear-gradient(90deg, ${planet.color}, ${planet.gradient[2]})`,
                        }} />
                      </div>
                    </div>
                  </div>
                </div>

                {/* Day length comparison */}
                <div className="glass rounded-xl p-5">
                  <h4 className="text-white text-sm font-bold mb-3">⏰ Comparação de Tempo</h4>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-white/5 rounded-lg p-3 text-center">
                      <div className="text-[10px] text-gray-400 mb-1">🔄 Um dia em {planet.namePt}</div>
                      <div className="text-white text-sm font-bold">{planet.facts.rotationPeriod}</div>
                    </div>
                    <div className="bg-white/5 rounded-lg p-3 text-center">
                      <div className="text-[10px] text-gray-400 mb-1">🌀 Um ano em {planet.namePt}</div>
                      <div className="text-white text-sm font-bold">{planet.facts.orbitalPeriod}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}





const allQuestions[] = [
  { question: "Qual é o maior planeta do Sistema Solar?", options: ["Saturno", "Júpiter", "Urano", "Netuno"], correct: 1, explanation: "Júpiter é o maior planeta, com diâmetro de 139.820 km — cabem mais de 1.300 Terras dentro dele!", difficulty: "fácil" },
  { question: "Qual planeta é conhecido como 'Planeta Vermelho'?", options: ["Vênus", "Mercúrio", "Marte", "Júpiter"], correct: 2, explanation: "Marte é chamado de Planeta Vermelho devido ao óxido de ferro (ferrugem) em sua superfície.", difficulty: "fácil" },
  { question: "Quantas luas a Terra possui?", options: ["0", "1", "2", "3"], correct: 1, explanation: "A Terra possui apenas uma lua natural, chamada simplesmente de Lua.", difficulty: "fácil" },
  { question: "Qual é o planeta mais quente do Sistema Solar?", options: ["Mercúrio", "Vênus", "Marte", "Júpiter"], correct: 1, explanation: "Apesar de Mercúrio ser mais próximo do Sol, Vênus é mais quente (462°C) por causa de seu efeito estufa extremo.", difficulty: "médio" },
  { question: "Qual planeta é famoso por seus anéis?", options: ["Júpiter", "Urano", "Saturno", "Netuno"], correct: 2, explanation: "Saturno é famoso por seus anéis espetaculares, compostos de gelo e rocha.", difficulty: "fácil" },
  { question: "Qual é o menor planeta do Sistema Solar?", options: ["Marte", "Vênus", "Terra", "Mercúrio"], correct: 3, explanation: "Mercúrio é o menor planeta, com apenas 4.879 km de diâmetro.", difficulty: "fácil" },

  { question: "Qual planeta gira de lado com inclinação de 98°?", options: ["Netuno", "Saturno", "Urano", "Mercúrio"], correct: 2, explanation: "Urano tem uma inclinação axial de 98°, fazendo-o girar praticamente de lado.", difficulty: "médio" },
  { question: "Qual planeta tem os ventos mais fortes do sistema solar?", options: ["Júpiter", "Saturno", "Urano", "Netuno"], correct: 3, explanation: "Netuno possui os ventos mais fortes do sistema solar, chegando a 2.100 km/h!", difficulty: "difícil" },

function Quiz({ onClose }: { onClose: () => void }) {
  const questions = useMemo(() => {
    const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 10);
  }, []);

  const [currentQ, setCurrentQ] = useState(0);
  const [selected, setSelected] = useState<number | null>(null);
  const [score, setScore] = useState(0);
  const [showResult, setShowResult] = useState(false);
  const [answered, setAnswered] = useState(false);
  const [streak, setStreak] = useState(0);
  const [maxStreak, setMaxStreak] = useState(0);

  const question = questions[currentQ];

  const handleAnswer = (index) => {
    if (answered) return;
    setSelected(index);
    setAnswered(true);
    if (index === question.correct) {
      setScore(s => s + 1);
      const newStreak = streak + 1;
      setStreak(newStreak);
      if (newStreak > maxStreak) setMaxStreak(newStreak);
    } else {
      setStreak(0);
    }
  };

  const handleNext = () => {
    if (currentQ < questions.length - 1) {
      setCurrentQ(q => q + 1);
      setSelected(null);
      setAnswered(false);
    } else {
      setShowResult(true);
    }
  };

  const handleRestart = () => {
    setCurrentQ(0);
    setSelected(null);
    setScore(0);
    setShowResult(false);
    setAnswered(false);
    setStreak(0);
    setMaxStreak(0);
  };

  const getScoreEmoji = () => {
    const pct = score / questions.length;
    if (pct === 1) return "🏆";
    if (pct >= 0.8) return "🌟";
    if (pct >= 0.6) return "👍";
    if (pct >= 0.4) return "📚";
    return "🔭";
  };

  const getScoreMessage = () => {
    const pct = score / questions.length;
    if (pct === 1) return "Perfeito! Você é um gênio espacial!";
    if (pct >= 0.8) return "Excelente! Você sabe muito sobre o espaço!";
    if (pct >= 0.6) return "Bom trabalho! Continue explorando!";
    if (pct >= 0.4) return "Não desista! O espaço tem muito a ensinar!";
    return "Explore mais o sistema solar e tente novamente!";
  };

  const difficultyColor = { fácil: "text-emerald-400", médio: "text-yellow-400", difícil: "text-red-400" };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fadeIn" style={{
      background: "radial-gradient(circle at center, rgba(30,20,60,0.98), rgba(2,0,16,0.99))"
    }}>
      <div className="relative glass-strong rounded-2xl max-w-xl w-full shadow-2xl" style={{ borderColor: "rgba(99,102,241,0.2)" }}>
        <button onClick={onClose}
          className="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white text-lg transition-colors z-10 cursor-pointer">
          ✕
        </button>

        <div className="p-8">
          {showResult ? (
            <div className="text-center animate-fadeIn">
              <div className="text-7xl mb-4">{getScoreEmoji()}</div>
              <h2 className="text-3xl font-bold text-white mb-2">Quiz Completo!</h2>
              <p className="text-indigo-300 text-lg mb-6">{getScoreMessage()}</p>
              <div className="glass rounded-2xl p-6 mb-6">
                <div className="text-5xl font-bold text-white mb-1">{score}/{questions.length}</div>
                <div className="text-indigo-300">respostas corretas</div>
                <div className="mt-4 w-full bg-gray-800 rounded-full h-3">
                  <div className="h-3 rounded-full transition-all duration-1000 ease-out" style={{
                    width: `${(score / questions.length) * 100}%`,
                    background: "linear-gradient(90deg, #6366f1, #a855f7, #ec4899)",
                  }} />
                </div>
                {maxStreak > 1 && (
                  <div className="mt-3 text-yellow-400 text-sm">🔥 Melhor sequência: {maxStreak} acertos seguidos!</div>
                )}
              </div>
              <div className="flex gap-3">
                <button onClick={handleRestart}
                  className="flex-1 py-3 px-6 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold transition-colors cursor-pointer">
                  🔄 Tentar Novamente
                </button>
                <button onClick={onClose}
                  className="flex-1 py-3 px-6 bg-white/10 hover:bg-white/20 text-white rounded-xl font-semibold transition-colors cursor-pointer">
                  🪐 Voltar
                </button>
              </div>
            </div>
          ) : (
            <>
              <div className="flex items-center justify-between mb-4">
                <span className="text-indigo-400 text-sm font-medium">
                  Pergunta {currentQ + 1}/{questions.length}
                </span>
                <div className="flex items-center gap-3">
                  {streak >= 2 && <span className="text-yellow-400 text-sm">🔥 {streak}x</span>}
                  <span className={`text-xs px-2 py-0.5 rounded-full border border-current ${difficultyColor[question.difficulty]}`}>
                    {question.difficulty}
                  </span>
                  <span className="text-indigo-400 text-sm font-medium">⭐ {score}</span>
                </div>
              </div>
              <div className="w-full bg-gray-800 rounded-full h-1.5 mb-6">
                <div className="h-1.5 rounded-full transition-all duration-500" style={{
                  width: `${((currentQ + 1) / questions.length) * 100}%`,
                  background: "linear-gradient(90deg, #6366f1, #a855f7)",
                }} />
              </div>

              <h3 className="text-xl font-bold text-white mb-6">{question.question}</h3>

              <div className="space-y-2.5 mb-6">
                {question.options.map((option, i) => {
                  let classes = "bg-white/5 border-white/10 hover:bg-white/10 hover:border-white/20";
                  if (answered) {
                    if (i === question.correct) classes = "bg-emerald-500/20 border-emerald-500/50";
                    else if (i === selected && i !== question.correct) classes = "bg-red-500/20 border-red-500/50";
                    else classes = "bg-white/5 border-white/5 opacity-40";
                  }
                  return (
                    <button key={i} onClick={() => handleAnswer(i)}
                      className={`w-full text-left p-4 rounded-xl border transition-all text-white ${classes} ${!answered ? "cursor-pointer" : "cursor-default"}`}>
                      <span className="font-medium text-gray-400 mr-2">{String.fromCharCode(65 + i)}.</span>
                      {option}
                      {answered && i === question.correct && <span className="ml-2">✅</span>}
                      {answered && i === selected && i !== question.correct && <span className="ml-2">❌</span>}
                    </button>
                  );
                })}
              </div>

              {answered && (
                <div className="glass rounded-xl p-4 mb-4 animate-fadeInUp" style={{ borderColor: "rgba(99,102,241,0.2)" }}>
                  <p className="text-indigo-200 text-sm">💡 {question.explanation}</p>
                </div>
              )}

              {answered && (
                <button onClick={handleNext}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold transition-colors cursor-pointer">
                  {currentQ < questions.length - 1 ? "Próxima Pergunta →" : "Ver Resultado 🏆"}
                </button>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}



function App() {
  const [selectedPlanet, setSelectedPlanet] = useState(null);
  const [showSun, setShowSun] = useState(false);
  const [showQuiz, setShowQuiz] = useState(false);
  const [isPaused, setIsPaused] = useState(false);
  const [isDiving, setIsDiving] = useState(false);
  const [zoomedPlanet, setZoomedPlanet] = useState<string | null>(null);
  const [showSpeedControl, setShowSpeedControl] = useState(false);

  const handlePlanetClick = useCallback((planet) => {
    setZoomedPlanet(planet.id);
    setTimeout(() => {
      setSelectedPlanet(planet);
      setShowSun(false);
      setIsDiving(true);
    }, 400);
  }, []);

  const handleSunClick = useCallback(() => {
    setZoomedPlanet("sun");
    setTimeout(() => {
      setShowSun(true);
      setSelectedPlanet(null);
      setIsDiving(true);
    }, 400);
  }, []);

  const handleClose = useCallback(() => {
    setIsDiving(false);
    setSelectedPlanet(null);
    setShowSun(false);
    setZoomedPlanet(null);
  }, []);

  return (
    <div className="w-screen h-screen bg-gradient-to-b from-[#020010] via-[#050520] to-[#0a0a2e] overflow-hidden relative select-none">
      {/* Stars Background */}
      <Stars />

      {/* Title */}
      {!isDiving && (
        <div className="absolute top-5 left-1/2 -translate-x-1/2 z-20 text-center animate-fadeIn">
          <h1 className="text-2xl md:text-4xl font-bold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent drop-shadow-lg">
            🌌 Sistema Solar Interativo
          </h1>
          <p className="text-gray-500 text-[11px] md:text-xs mt-1.5 font-medium">
            Clique em qualquer planeta para mergulhar e explorar
          </p>
        </div>
      )}

      {/* Side Planet List */}
      {!isDiving && (
        <PlanetList
          onPlanetClick={handlePlanetClick}
          onSunClick={handleSunClick}
          activePlanet={zoomedPlanet}
        />
      )}

      {/* Controls */}
      {!isDiving && (
        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex gap-2.5 animate-fadeIn">
          <button
            onClick={() => setIsPaused(!isPaused)}
            className="px-4 py-2.5 glass hover:bg-white/10 text-white rounded-full text-xs font-medium transition-all cursor-pointer flex items-center gap-2"
          >
            {isPaused ? "▶️ Continuar" : "⏸️ Pausar"}
          </button>
          <button
            onClick={() => setShowSpeedControl(!showSpeedControl)}
            className="px-4 py-2.5 glass hover:bg-white/10 text-white rounded-full text-xs font-medium transition-all cursor-pointer flex items-center gap-2"
          >
            ⚡ Controles
          </button>
          <button
            onClick={() => setShowQuiz(true)}
            className="px-4 py-2.5 text-white rounded-full text-xs font-medium transition-all cursor-pointer flex items-center gap-2"
            style={{
              background: "linear-gradient(135deg, rgba(99,102,241,0.7), rgba(168,85,247,0.7))",
              border: "1px solid rgba(99,102,241,0.3)",
            }}
          >
            🧠 Quiz Espacial
          </button>
        </div>
      )}

      {/* Instructions tooltip */}
      {showSpeedControl && !isDiving && (
        <div className="absolute bottom-20 left-1/2 -translate-x-1/2 z-20 glass rounded-xl p-4 max-w-xs animate-fadeInUp">
          <div className="text-white text-sm font-bold mb-2">🎮 Como usar</div>
          <ul className="text-gray-300 text-xs space-y-1.5">
            <li>🖱️ <strong>Clique</strong> em um planeta para mergulhar</li>
            <li>🔍 Explore <strong>5 abas</strong> de informações</li>
            <li>🏗️ Veja a <strong>estrutura interna</strong></li>
            <li>📊 <strong>Compare</strong> com a Terra</li>
            <li>🧠 Teste seu conhecimento no <strong>Quiz</strong></li>
            <li>🖱️ Mova o mouse para efeito <strong>parallax 3D</strong></li>
          </ul>
          <button onClick={() => setShowSpeedControl(false)} className="mt-3 text-indigo-400 text-xs cursor-pointer hover:text-indigo-300">
            Fechar ✕
          </button>
        </div>
      )}

      {/* Solar System */}
      {!isDiving && (
        <div className="absolute inset-0 pl-16 md:pl-[72px]">
          <SolarSystem
            onPlanetClick={handlePlanetClick}
            onSunClick={handleSunClick}
            isPaused={isPaused}
            zoomedPlanet={zoomedPlanet}
          />
        </div>
      )}

      {/* Dive View */}
      {isDiving && (
        <PlanetDive
          planet={selectedPlanet}
          showSun={showSun}
          onClose={handleClose}
        />
      )}

      {/* Quiz Modal */}
      {showQuiz && <Quiz onClose={() => setShowQuiz(false)} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
